<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestion scolaire</title>

        <!-- AI made : applique le thème sauvegardé avant l'affichage (évite un flash clair en mode sombre).
             Même clé "axeTheme" que services/storage.js -->
        <script>
            try { if (localStorage.getItem("axeTheme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}
        </script>

        <!-- CSS -->
        <link rel="stylesheet" type="text/css" href="../css/style.css">

        <!-- JS -->
        <script type="module" src="../../src/js/main.js" defer></script>

        <!-- Lib -->
        <script src="../../node_modules/chart.js/dist/chart.umd.min.js"></script>
        <script src="../../node_modules/dompurify/dist/purify.min.js"></script>

        <link rel="stylesheet" href="../../node_modules/quill/dist/quill.snow.css">
        <script src="../../node_modules/quill/dist/quill.js"></script>
    </head>
    <body>
        <!-- AI made -->
        <div class="page-shell">
        <header class="header">
            <div class="header__hour-Box">
                <div class="header__hour-Box__text">

                </div>
            </div>

            <label class="header__burger">
                <input type="checkbox">

                <span></span>
                <span></span>
                <span></span>

                <nav class="mobile-menu">
                    <a href="../../index.html">Dashboard</a>
                    <a href="schedule.html">Emploi du temps</a>
                    <a href="habits.html">Habitudes</a>
                    <a href="graphs-stats.html">Graphiques et Stats</a>
                    <a href="scolar.html" aria-current="page">Gestion Scolaire</a>
                </nav>
            </label>

            <div class="header__menu">
                <nav class="header__nav">
                    <ul>
                        <li>
                            <a class="header__menu__link" href="../../index.html">Dashboard</a>
                        </li>
                        <li>
                            <a class="header__menu__link" href="schedule.html">Emploi du temps</a>
                        </li>
                        <li>
                            <a class="header__menu__link" href="habits.html">Habitudes</a>
                        </li>
                        <li>
                            <a class="header__menu__link" href="graphs-stats.html">Graphiques & stats</a>
                        </li>
                        <li>
                            <a class="header__menu__link" href="scolar.html" aria-current="page">Gestion Scolaire</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="header__day-Box">
                <div class="header__day-Box__text">

                </div>
            </div>
            <!-- AI made -->
            <button type="button" id="themeToggle" class="header__theme-toggle" aria-label="Basculer le thème clair/sombre">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </header>

        <main class="main main--scolar">

            <!-- AI made -->
            <div class="page-header">
                <div>
                    <h1 class="page-header__title">Gestion scolaire</h1>
                </div>
            </div>
                <button class="flashcardCreateButton">
                    <span class="text">Créer</span>
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path d="M9.3 0h5.4v9.3H24v5.4h-9.3V24H9.3v-9.3H0V9.3h9.3z"></path>
                        </svg>
                    </span>
                </button>
            <div class="scolar">
                
                <div class="flashcardBox">
                    <article class="flashcard" data-flashcard-id="1791536605892">
                        <div class="flashcard__inner">
                            <div class="flashcard__face flashcard__face--front">
                                <p>efefef</p>
                            </div>
                            <div class="flashcard__face flashcard__face--back">
                                <p>sfsfsf</p>
                            </div>
                        </div>

                        <div class="flashcard__commands">
                            <div class="flashcard__commands__button flashcard__commands__button--edit">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>
                            </div>
                            <div class="flashcard__commands__button flashcard__commands__button--del">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </div>
                            <div class="flashcard__commands__button flashcard__commands__button--copy">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy preview-icon"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <!-- AI made : popup flashcard, cachée par défaut -->
            <div class="overlayPopupFlashcardLab overlayPopupFlashcardLab--hidden">
                <div class="popupFlashcardLab" role="dialog" aria-modal="true">
                    <p>Entrez le texte au recto et au verso :</p>
                    <!-- AI made : barre d'outils Quill horizontale au-dessus de la carte éditable (un éditeur par face) -->
                    <div class="flashcardLab">
                        <!-- AI made : bouton "Switch" qui retourne la carte + barre d'outils de la face visible
                             (la barre du verso est dupliquée par flashcardsEditor.js) -->
                        <div class="flashcardLab__controls">
                            <button type="button" class="flashcardSwitch" aria-label="Retourner la carte" aria-pressed="false" data-tooltip="Switch">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                            </button>
                            <div id="flashcardToolbarFront" class="flashcardToolbar">
                                <span class="ql-formats">
                                    <select class="ql-size" aria-label="Taille du texte">
                                        <option value="12px">12px</option>
                                        <option value="14px">14px</option>
                                        <option selected></option>
                                        <option value="18px">18px</option>
                                        <option value="24px">24px</option>
                                        <option value="32px">32px</option>
                                        <option value="48px">48px</option>
                                    </select>
                                </span>
                                <span class="ql-formats">
                                    <button class="ql-bold" aria-label="Gras"></button>
                                    <button class="ql-italic" aria-label="Italique"></button>
                                    <button class="ql-underline" aria-label="Souligné"></button>
                                </span>
                                <span class="ql-formats">
                                    <select class="ql-color" aria-label="Couleur du texte"></select>
                                    <select class="ql-background" aria-label="Surlignage"></select>
                                </span>
                                <span class="ql-formats">
                                    <select class="ql-align" aria-label="Alignement"></select>
                                    <button class="ql-clean" aria-label="Effacer la mise en forme"></button>
                                </span>
                            </div>
                        </div>

                        <article class="editableFlashcard">
                            <div class="editableFlashcard__inner">
                                <div class="editableFlashcard__face editableFlashcard__face--front">
                                    <div id="editorFront" class="flashcardEditor"></div>
                                </div>
                                <div class="editableFlashcard__face editableFlashcard__face--back">
                                    <div id="editorBack" class="flashcardEditor"></div>
                                </div>
                            </div>
                        </article>

                        <button class="flashcardLab__saveButton">
                            Enregistrer
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer__text">Morgan Davila - <span id="year"></span></div>
        </footer>
        </div>
    </body>
</html>
